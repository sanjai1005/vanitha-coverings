server.port=8080

spring.application.name=vanitha-coverings

# Datasource Setup (Defaults to embedded H2 for zero-config Render deployment, overridable via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vanithadb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart config for images upload
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
logging.level.org.hibernate.SQL=WARN
logging.level.com.vanitha=INFO
