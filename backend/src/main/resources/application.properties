server.port=8080

spring.application.name=vanitha-coverings

# MySQL Datasource Setup
spring.datasource.url=jdbc:mysql://localhost:3306/vanitha_coverings?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=@Sanjai10
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Multipart config for images upload (base64 or direct upload support)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
logging.level.org.hibernate.SQL=WARN
logging.level.com.vanitha=INFO
